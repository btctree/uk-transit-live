# Auto-deploy on every push: SSH to the server, pull, restart.
# Set repo secrets: SERVER_HOST, SERVER_USER, SSH_KEY (private key).
name: deploy
on: { push: { branches: [main] } }
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd /opt/uk-transit && git pull
            pip3 install -r uk_transit_live/requirements.txt --quiet
            sudo systemctl restart uk-transit
