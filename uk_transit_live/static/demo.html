const esc = s => (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const map = L.map('map', {preferCanvas:true}).setView([54.4,-2.8], 6);
L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {attribution:'&copy; OSM &copy; CARTO', maxZoom:19}).addTo(map);
function go(a,b,z){ map.setView([a,b],z); }

function busSvg(){return '<svg class="vsvg" viewBox="0 0 40 22"><ellipse cx="20" cy="19.6" rx="15" ry="2" fill="rgba(0,0,0,.30)"/><rect x="2" y="1.5" width="36" height="16" rx="2.5" fill="#c8102e"/><path d="M2 4 a2.5 2.5 0 0 1 2.5-2.5 h31 a2.5 2.5 0 0 1 2.5 2.5 v5 h-36 z" fill="#e23a4e"/><rect x="4.5" y="3.2" width="5" height="4" rx="0.8" fill="#cfe8fa"/><rect x="11" y="3.2" width="5" height="4" rx="0.8" fill="#cfe8fa"/><rect x="17.5" y="3.2" width="5" height="4" rx="0.8" fill="#cfe8fa"/><rect x="24" y="3.2" width="5" height="4" rx="0.8" fill="#cfe8fa"/><rect x="4.5" y="10" width="5" height="4.5" rx="0.8" fill="#cfe8fa"/><rect x="11" y="10" width="5" height="4.5" rx="0.8" fill="#cfe8fa"/><rect x="17.5" y="10" width="5" height="4.5" rx="0.8" fill="#cfe8fa"/><rect x="30.5" y="9.5" width="6" height="5.5" rx="0.8" fill="#cfe8fa"/><rect x="2" y="15.6" width="36" height="1.9" fill="#8e0b20"/><circle cx="10" cy="18" r="2.5" fill="#1a1a1a"/><circle cx="29" cy="18" r="2.5" fill="#1a1a1a"/></svg>';}
function trainSvg(c){return '<svg class="vsvg" viewBox="0 0 46 17"><ellipse cx="23" cy="15" rx="19" ry="1.8" fill="rgba(0,0,0,.30)"/><path d="M4 2.5 h33 q5 0 7 6 l1 3.5 h-44 q-2 0-2-2 v-5 q0-2.5 2.5-2.5 z" fill="'+c+'"/><path d="M4 2.5 h33 q3 0 5 2.5 l-40 0 q0-2.5 2.5-2.5 z" fill="rgba(255,255,255,.28)"/><rect x="6" y="6" width="24" height="3.6" rx="1.2" fill="#eaf4fb"/><path d="M33 6 h5 q2 0 3 3.6 h-8 z" fill="#eaf4fb"/><circle cx="11" cy="13.4" r="1.9" fill="#1a1a1a"/><circle cx="19" cy="13.4" r="1.9" fill="#1a1a1a"/><circle cx="28" cy="13.4" r="1.9" fill="#1a1a1a"/><circle cx="37" cy="13.4" r="1.9" fill="#1a1a1a"/></svg>';}
function tramSvg(c){return '<svg class="vsvg" viewBox="0 0 36 19"><ellipse cx="18" cy="17" rx="14" ry="1.7" fill="rgba(0,0,0,.30)"/><path d="M13 4 L20 1 L20 4" fill="none" stroke="#555" stroke-width="1"/><rect x="3" y="4" width="30" height="11.5" rx="3" fill="'+c+'"/><rect x="3" y="4" width="30" height="4.5" rx="3" fill="rgba(255,255,255,.28)"/><rect x="5.5" y="6.5" width="6" height="4.5" rx="1" fill="#eaf4fb"/><rect x="14" y="6.5" width="6" height="4.5" rx="1" fill="#eaf4fb"/><rect x="22.5" y="6.5" width="8" height="4.5" rx="1" fill="#eaf4fb"/><circle cx="10" cy="15.7" r="1.8" fill="#1a1a1a"/><circle cx="26" cy="15.7" r="1.8" fill="#1a1a1a"/></svg>';}
function boatSvg(c){return '<svg class="vsvg" viewBox="0 0 40 20"><ellipse cx="20" cy="18" rx="15" ry="1.8" fill="rgba(0,0,0,.25)"/><path d="M4 11 h32 l-4 5 q-1 1.2-2.6 1.2 h-19 q-1.6 0-2.6-1.2 z" fill="'+c+'"/><rect x="10" y="5.5" width="19" height="5.5" rx="1.5" fill="#f4f8fb"/><rect x="12" y="7" width="3.6" height="2.6" rx="0.6" fill="#9fc4dd"/><rect x="17.4" y="7" width="3.6" height="2.6" rx="0.6" fill="#9fc4dd"/><rect x="22.8" y="7" width="3.6" height="2.6" rx="0.6" fill="#9fc4dd"/><path d="M29 5.5 l4 5.5 h-4 z" fill="#e6eef4"/><path d="M2 17 q4 2 8 0 q4 2 8 0 q4 2 8 0 q4 2 8 0" fill="none" stroke="#7db8dc" stroke-width="1.3"/></svg>';}
function icon(kind,c,flip){ const s = kind==='bus'?busSvg():kind==='tram'?tramSvg(c):kind==='boat'?boatSvg(c):trainSvg(c);
  return L.divIcon({className:'vehwrap', html:'<div style="'+(flip?'transform:scaleX(-1)':'')+'">'+s+'</div>', iconSize:[28,16], iconAnchor:[14,10]}); }

// ---- layers ----
const chipLayer = L.layerGroup().addTo(map);
DATA.chips.forEach(c => {
  L.marker([c[1],c[2]], {icon: L.divIcon({className:'chipwrap', html:'<div class="citychip">'+esc(c[0])+'<span>≈'+c[3].toLocaleString()+' live 🚌</span></div>', iconSize:null})})
    .on('click', () => map.setView([c[1],c[2]], 12)).addTo(chipLayer);
});
const lineLayer = L.layerGroup();
const linePolys = {};
Object.entries(DATA.lines).forEach(([id,l]) => {
  linePolys[id] = l.paths.map(p => L.polyline(p, {color:l.colour, weight:3, opacity:.8}).addTo(lineLayer));
  l.stations.forEach(s => {
    const m = L.circleMarker([s[2], s[3]], {radius:4, color:'#fff', weight:1.2, fillColor:l.colour, fillOpacity:1}).addTo(lineLayer);
    m.bindTooltip(esc(s[1]), {direction:'top'});
    m.on('click', () => openBoard(s[0], s[1]));
  });
});

// ---- vehicles with viewport culling (the perf fix) ----
const vehLayer = L.layerGroup();
const allVehicles = [];
DATA.tfl.forEach(v => allVehicles.push({lat:v[0], lon:v[1], kind:v[2], colour:v[3], line:v[4], m:null}));
DATA.buses.forEach(v => allVehicles.push({lat:v[0], lon:v[1], kind:'bus', colour:'#c8102e', route:v[2], flip:v[3]>180, m:null}));

function journeyPopup(kind, lineId){
  const d = kind==='bus' ? DATA.jb : DATA.jt;
  if (!d) return 'No example journey.';
  const rows = d.rows.map((r,i) => '<div class="poprow'+(i===d.rows.length-1?' term':'')+'">'
    + (r[2] ? '<span class="jump" data-stop="'+esc(r[2])+'" data-name="'+esc(r[0])+'">'+esc(r[0])+'</span>' : '<span>'+esc(r[0])+'</span>')
    + '<span>'+r[1]+' min</span></div>').join('');
  return '<div class="pop"><div class="pophead"><span style="font-size:9px;background:#f1c40f;color:#20262e;border-radius:4px;padding:1px 5px;vertical-align:2px;font-weight:700">SAMPLE</span> <b>'+esc(d.head)+'</b></div>'+rows
    + '<div class="popnote">One SAMPLE journey is shared by all vehicles in this frozen demo — in the LIVE app every bus/train shows its own onward stops</div></div>';
}

let highlightedPolys = null;
function highlight(lineId){
  clearHighlight();
  Object.entries(linePolys).forEach(([id, ps]) => ps.forEach(p => p.setStyle({opacity: id===lineId?0.95:0.08, weight: id===lineId?5:3})));
  highlightedPolys = lineId;
}
function clearHighlight(){
  if (highlightedPolys == null) return;
  Object.values(linePolys).forEach(ps => ps.forEach(p => p.setStyle({opacity:.8, weight:3})));
  highlightedPolys = null;
}
map.on('popupclose', clearHighlight);
map.on('popupopen', e => {
  const n = e.popup.getElement();
  if (n) n.addEventListener('click', ev => {
    const j = ev.target.closest('.jump');
    if (j) jumpToStop(j.dataset.stop, j.dataset.name);
  });
});

function makeMarker(v){
  const m = L.marker([v.lat, v.lon], {icon: icon(v.kind, v.colour, v.flip), keyboard:false});
  m.on('click', () => {
    m.bindPopup(journeyPopup(v.kind==='bus'?'bus':'train'), {maxWidth:300}).openPopup();
    const hl = v.kind==='bus' ? (DATA.jb && DATA.jb.lineId) : (v.line || (DATA.jt && DATA.jt.lineId));
    if (hl && DATA.lines[hl]) highlight(hl);
  });
  return m;
}
function cullVehicles(){
  if (map.getZoom() < DETAIL_ZOOM) return;
  const b = map.getBounds().pad(0.25);
  for (const v of allVehicles){
    const inView = b.contains([v.lat, v.lon]);
    if (inView && !v.m){ v.m = makeMarker(v); v.m.addTo(vehLayer); }
    else if (!inView && v.m){ vehLayer.removeLayer(v.m); v.m = null; }
  }
}

// ---- stops with baked boards ----
const stopLayer = L.layerGroup();
const stopById = {};
DATA.stops.forEach(s => {
  stopById[s[0]] = s;
  const m = L.circleMarker([s[3], s[4]], {radius:5.5, color:'#fff', weight:1.4, fillColor:'#DC241F', fillOpacity:.95}).addTo(stopLayer);
  m.bindTooltip(esc(s[1]) + (s[2] ? ' ('+esc(s[2])+')' : '') + '<br><small>'+esc(s[5])+'</small>', {direction:'top'});
  m.on('click', () => openBoard(s[0], s[1] + (s[2] ? ' ('+s[2]+')' : '')));
});
// station coords for journey jumps
const stationCoord = {};
Object.values(DATA.lines).forEach(l => l.stations.forEach(s => { stationCoord[s[0]] = [s[2], s[3], s[1]]; }));

function dueText(sec){ return sec < 45 ? 'due' : Math.round(sec/60) + ' min'; }
function groupRows(arrs, maxRows){
  const g = new Map();
  arrs.forEach(a => {
    const k = a[0]+'|'+a[1];
    if (!g.has(k)) g.set(k, {line:a[0], dest:a[1], plat:a[2], times:[]});
    if (g.get(k).times.length < 2) g.get(k).times.push(a[3]);
  });
  return [...g.values()].sort((x,y)=>x.times[0]-y.times[0]).slice(0,maxRows).map(r =>
    '<div class="arr"><div class="routeno">'+esc(r.line)+'</div><div class="dest">'+esc(r.dest)
    + (r.plat ? '<div class="sub">'+esc(r.plat)+'</div>' : '') + '</div><div class="due">'+r.times.map(dueText).join(', ')+'</div></div>').join('');
}
let curStop = null;
function openBoard(id, name){
  curStop = {id, name};
  $('bt').textContent = name;
  $('bstar').textContent = favs.some(f => f.id === id) ? '★' : '☆';
  const b = DATA.boards[id];
  $('bb').innerHTML = b && b.length ? groupRows(b, 12)
    : '<div class="empty">No baked times for this stop in the demo — the live app fetches every stop live.</div>';
  $('board').classList.add('show');
}
$('bx').onclick = () => $('board').classList.remove('show');
function jumpToStop(id, name){
  map.closePopup();
  const st = stationCoord[id] || (stopById[id] ? [stopById[id][3], stopById[id][4], stopById[id][1]] : null);
  if (st){ map.setView([st[0], st[1]], Math.max(map.getZoom(), 15)); openBoard(id, st[2] || name); }
  else openBoard(id, name);
}

// ---- favourites (localStorage, same as live app) ----
let favs = [];
try { favs = JSON.parse(localStorage.getItem('ukt_demo_favs')) || []; } catch {}
function saveFavs(){ localStorage.setItem('ukt_demo_favs', JSON.stringify(favs)); renderFavs(); }
$('bstar').onclick = () => {
  if (!curStop) return;
  favs = favs.some(f => f.id === curStop.id) ? favs.filter(f => f.id !== curStop.id) : [...favs, curStop];
  $('bstar').textContent = favs.some(f => f.id === curStop.id) ? '★' : '☆';
  saveFavs();
};
function renderFavs(){
  $('favbody').innerHTML = favs.length ? favs.map(f => {
    const b = DATA.boards[f.id];
    return '<div class="favstop"><div class="favname"><span onclick="jumpToStop(\''+esc(f.id)+'\',\''+esc(f.name)+'\')">'+esc(f.name)+'</span>'
      + '<span class="unstar" onclick="favs=favs.filter(x=>x.id!==\''+esc(f.id)+'\');saveFavs()">★</span></div>'
      + (b && b.length ? groupRows(b, 3) : '<div class="empty">No baked times in demo.</div>') + '</div>';
  }).join('') : '<div class="empty">Open a red stop dot and tap ☆ to build your dashboard. In the live app this refreshes every 30s.</div>';
}
function toggleFavs(){ $('favs').classList.toggle('show'); $('disr').style.display='none'; renderFavs(); }
function showDisr(){
  const el = $('disr');
  el.style.display = el.style.display === 'none' ? 'block' : 'none';
  $('favs').classList.remove('show');
  $('disrbody').innerHTML = DATA.disr.length ? DATA.disr.map(d =>
    '<div style="display:flex;gap:8px;padding:6px 0;border-bottom:1px solid #eff2f5;font-size:12px"><span style="width:12px;height:12px;border-radius:4px;flex-shrink:0;margin-top:2px;background:'+esc(d[1])+'"></span><div><b>'+esc(d[0])+'</b> — '+esc(d[2])+(d[3]?'<div style="color:#7a8794;font-size:11px;margin-top:2px">'+esc(d[3])+'</div>':'')+'</div></div>').join('')
    : '<div class="empty">✅ Nothing reported — all London lines running normally at capture time.</div>';
}

// ---- search + near me ----
async function searchPlace(){
  const q = $('q').value.trim(); if (!q) return;
  const el = $('results');
  el.innerHTML = '<div>Searching…</div>';
  try {
    const r = await fetch('https://nominatim.openstreetmap.org/search?format=json&countrycodes=gb&limit=5&q='+encodeURIComponent(q));
    const res = await r.json();
    el.innerHTML = res.length ? '' : '<div>No UK matches.</div>';
    res.forEach(m => {
      const d = document.createElement('div');
      d.textContent = m.display_name.split(',').slice(0,3).join(',');
      d.onclick = () => { map.setView([+m.lat, +m.lon], 15); el.innerHTML=''; };
      el.appendChild(d);
    });
  } catch { el.innerHTML = '<div>Search failed.</div>'; }
}
$('q').addEventListener('keydown', e => { if (e.key === 'Enter') searchPlace(); });
function nearMe(){
  if (!navigator.geolocation) return;
  navigator.geolocation.getCurrentPosition(p => map.setView([p.coords.latitude, p.coords.longitude], 15),
    () => { $('results').innerHTML = '<div>Location unavailable (browsers may block it for local files — works on the live app).</div>'; });
}


// ---- rail stations (culled) ----
const railLayer = L.layerGroup();
function cullRail(){
  railLayer.clearLayers();
  if (map.getZoom() < 10) return;
  const b = map.getBounds().pad(0.2);
  let n = 0;
  for (const s of DATA.rail){
    if (!b.contains([s[2], s[3]])) continue;
    const m = L.circleMarker([s[2], s[3]], {radius:3, color:'#5b6773', weight:1, fillColor:'#fff', fillOpacity:.9}).addTo(railLayer);
    m.bindTooltip(esc(s[0])+' ('+esc(s[1])+') — rail station', {direction:'top'});
    if (++n >= 300) break;
  }
}
map.addLayer(railLayer);

// ---- zoom-driven disclosure ----
function sync(){
  const z = map.getZoom();
  document.body.classList.toggle('zl-s', z >= DETAIL_ZOOM && z < 13);
  document.body.classList.toggle('zl-m', z >= 13 && z < 15);
  const detail = z >= DETAIL_ZOOM;
  if (detail){ map.removeLayer(chipLayer); map.addLayer(lineLayer); map.addLayer(vehLayer); cullVehicles(); }
  else { map.addLayer(chipLayer); map.removeLayer(lineLayer); map.removeLayer(vehLayer); }
  if (z >= 14) map.addLayer(stopLayer); else map.removeLayer(stopLayer);
  $('count').textContent = detail
    ? vehLayer.getLayers().length.toLocaleString() + ' vehicles in view (of ' + allVehicles.length.toLocaleString() + ' baked)' + (z < 14 ? ' · zoom to street level for stops' : '')
    : DATA.total.toLocaleString() + ' buses live across the UK — zoom in or tap a city';
}
map.on('zoomend', () => { cullRail(); sync(); });
map.on('moveend', () => { cullVehicles(); cullRail(); sync(); });
sync();
</script></body></html>
